name: Screenshots

# 界面验证与截图：拉起完整系统（dev 演示数据），走一遍登录与收费业务后逐页截图。
# 手动运行（Actions 页面 → Screenshots → Run workflow）。全部截图作为运行结果的附件（Artifacts）上传，不推送任何分支；
# 带编号的 8 张与 README 中的文件名相同，核对后复制到 docs/images 并提交。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Start the full stack (dev profile with demo data)
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright and Chinese fonts
        timeout-minutes: 12
        run: |
          # 使用运行环境自带的 Google Chrome，不再下载浏览器
          cd tools/screenshots && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.56.1
          google-chrome --version
          # 中文字体：已有就跳过；先试软件源（每次最多 2 分钟），失败则从 GitHub 下载开源的 Noto Sans CJK
          if fc-list :lang=zh | grep -q .; then echo "CJK fonts present"; exit 0; fi
          timeout 120 sudo apt-get update -qq -o Acquire::Retries=2 \
            && timeout 120 sudo apt-get install -y -qq fonts-noto-cjk >/dev/null || echo "apt failed, downloading fonts"
          if ! fc-list :lang=zh | grep -q .; then
            mkdir -p ~/.local/share/fonts
            base=https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese
            for w in Regular Medium Bold; do
              curl -fsSL --retry 3 -o ~/.local/share/fonts/NotoSansCJKsc-$w.otf "$base/NotoSansCJKsc-$w.otf"
            done
            fc-cache -f >/dev/null
          fi
          fc-list :lang=zh | grep -q .

      - name: Wait for stack
        run: |
          for i in $(seq 1 150); do
            curl -fs http://localhost/api/auth/options >/dev/null && exit 0
            sleep 3
          done
          docker compose -f deploy/docker-compose.yml logs --tail 80
          exit 1

      - name: Capture
        env:
          FAULT_INJECTION: "1"
        run: node tools/screenshots/capture.mjs "$PWD/shots"

      - name: Backend errors
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml logs --no-color backend 2>&1 \
            | grep -E -A25 " ERROR | WARN .*(Exception|失败)" | head -400 > shots/backend-errors.txt || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: shots/
