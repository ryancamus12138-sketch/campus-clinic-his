server:
  port: 8080
  shutdown: graceful
  # 经 Nginx 转发：信任内网代理传来的 X-Forwarded-For/Proto，审计日志记录真实客户端地址
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 200
    # 放号瞬间的突发连接先排队，而不是在 TCP 层被拒绝；生产中 Nginx 还会先限流
    accept-count: 1000

spring:
  application:
    name: campus-clinic-his
  # 运行环境由 SPRING_PROFILES_ACTIVE 指定：dev（开发与演示编排）或 prod（生产编排），不设默认值。
  # 未指定时没有数据库口令和密钥，应用无法启动，不会意外以开发配置（演示账号、公开密钥）运行。
  threads:
    virtual:
      # 默认关闭：JDK 21 的虚拟线程在 synchronized 块内阻塞会占住载体线程，可能导致请求长时间挂起；
      # JDK 24 起（JEP 491）不再有此限制
      enabled: ${VIRTUAL_THREADS:false}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clinic}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&rewriteBatchedStatements=true
    # 最小权限：应用账号只有业务库的增删改查、审计库的查询和插入，没有任何建表改表权限
    username: ${DB_APP_USER:clinic_app}
    password: ${DB_APP_PASSWORD:}
    hikari:
      # 全局读已提交：并发正确性全部依赖条件更新、唯一键和 CHECK，而不是可重复读的快照；
      # RC 下没有间隙锁，批量插入和条件更新更不容易死锁（binlog 为 ROW 格式，MySQL 8 默认）
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # 连接数过多会加剧锁竞争；按服务器 CPU 核数调整
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    # 表结构变更使用单独的迁移账号，只在启动迁移时使用
    user: ${DB_MIGRATOR_USER:clinic_migrator}
    password: ${DB_MIGRATOR_PASSWORD:}
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: io.github.ryancamus.clinic.framework.mybatis.handler
  global-config:
    banner: false
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true

# 外部平台（统一支付、一卡通、医保结算、财政电子票据、追溯码上传）只定义了接口，当前版本没有实现，
# 对应功能在界面上显示“未接入”或由工作人员登记外部办理结果，因此没有相关配置项。
clinic:
  timezone: Asia/Shanghai
  # 使用本系统的机构名称，显示在登录页与页面标题；校区、收费点、收费项目在数据库中维护
  org:
    name: ${CLINIC_ORG_NAME:实践大学校医院}
  booking:
    payment-timeout: 15m
    # 新生体检是否由学校统一付费；默认学生自费，按本校规定修改
    exam-school-paid: false
  charge:
    counter-order-ttl: 2h
    # 单笔退费（个人自付部分）不超过该金额时自动通过，超过的需财务审批
    refund-auto-approve-limit: 200.00
    # 计费策略：划价时估算医保统筹与个人自付，按患者参保类型匹配，未匹配的按自费。
    # 起付线、报销比例、可报销项目由当地医保政策和学校与医保部门的协议决定，各校不同，部署时按本校实际配置；
    # 接入医保结算平台后以医保中心的结算结果为准，这里只用于划价估算。下面是示例：大学生医保在校医院门诊统筹 80%。
    # 职工医保、公费医疗在校医院的结算方式各校不同，默认按自费。
    fee-policies:
      - code: STU
        name: 大学生医保（示例：校医院门诊统筹 80%）
        insurance-types: [1]
        ratio: 0.80
  bootstrap:
    # 生产环境首次启动时创建 admin 账号，至少 10 位
    admin-password: ${ADMIN_INITIAL_PASSWORD:}
  crypto:
    # 敏感字段（证件号、手机号）加密。生产环境密钥由 deploy/gen-secrets.sh 生成，经 Docker secrets 注入
    algorithm: ${CRYPTO_ALGORITHM:SM4}
    active-key-id: ${CRYPTO_ACTIVE_KEY_ID:1}
    index-key: ${CRYPTO_INDEX_KEY:}
    keys:
      1: ${CRYPTO_KEY_1:}
  security:
    jwt:
      # 至少 32 字节。生产环境由 Docker secrets 注入（见 application-prod.yml），仍是此占位值时拒绝启动
      secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
      access-ttl: 30m
      refresh-ttl: 7d
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: campus-clinic-his
    distribution:
      # 接口耗时直方图：Prometheus 据此计算 P99；SLO 档位与压测目标（200ms）对齐
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    io.github.ryancamus.clinic: info
