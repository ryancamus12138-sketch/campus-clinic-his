# 管理端、接口转发的公共部分，HTTP 与 HTTPS 两种入口共用。
# 系统没有文件上传接口，请求体都是 JSON，1 MB 足够；超过的直接返回 413
client_max_body_size 1m;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# 链路 ID 在入口生成，后端沿用并写入日志与响应
proxy_set_header X-Trace-Id $request_id;

# 登录：防暴力破解（应用层另有 5 次失败锁定）
location = /api/auth/login {
    limit_req zone=login_ip burst=20 nodelay;
    proxy_pass http://clinic_backend;
}

location /api/ {
    limit_req zone=per_ip burst=40 nodelay;
    proxy_pass http://clinic_backend;
}

# 健康检查只开放 /actuator/health，且只允许内网地址，供学校信息中心的监控平台接入；
# 其他管理端点（指标等）不经 Nginx 对外提供
location ^~ /actuator/health {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://clinic_backend;
}

location ^~ /actuator/ {
    return 404;
}

# Nginx 自身的存活检查，供容器健康检查使用；只返回 ok，不涉及后端和任何数据
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location /assets/ {
    root /usr/share/nginx/html/admin;
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

# 页面入口不缓存：升级后浏览器立即拿到引用新资源文件的 index.html
location = /index.html {
    root /usr/share/nginx/html/admin;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}

# 前端路由（如 /charge/settle）刷新时回落到 index.html
location / {
    root /usr/share/nginx/html/admin;
    try_files $uri $uri/ /index.html;
}
