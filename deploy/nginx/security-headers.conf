# 安全响应头。Nginx 中 location 一旦自己写了 add_header 就不再继承上层的，
# 所以单独成文件，在 server 和需要额外响应头的 location 里分别 include。
# HSTS 的值由入口文件设置：HTTPS 下为 max-age=63072000，HTTP 下为空（不输出）
add_header Strict-Transport-Security $hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 跨源隔离（缓解 Spectre 类侧信道）：不与其他源共享浏览上下文和资源
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Element Plus 运行时会写内联样式，因此 style-src 需要 'unsafe-inline'；脚本只允许同源文件
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
