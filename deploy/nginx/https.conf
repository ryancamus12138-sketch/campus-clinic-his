# 校医院门诊收费系统入口
#   /         管理端（收费员、医生、药师、财务、系统管理员、审计管理员）
#   /api/     后端接口
#
# 限流是第一层防线：异常的大量请求在 Nginx 直接返回 429，不进入应用。

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_ip:10m rate=10r/m;
limit_req_status 429;

upstream clinic_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # 证书签发与续期（ACME http-01）的验证文件走 80 端口，其余全部跳转到 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # Mozilla Intermediate 配置：只开 TLS 1.2/1.3，前向保密的 AEAD 套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:clinic_tls:10m;
    ssl_session_tickets off;

    # 浏览器在两年内只用 HTTPS 访问本站
    set $hsts "max-age=63072000";
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/clinic-locations.conf;
}

