# 首次签发证书的引导入口（CLINIC_TLS=acme-bootstrap，由 ./clinic.sh cert-bootstrap 启动）。
# 只在 80 端口提供 ACME http-01 验证文件，不提供管理端页面和接口，也不连接后端：
# 证书到位之前，系统不会以明文 HTTP 对外服务。
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 503 "certificate bootstrap in progress\n";
    }
}
