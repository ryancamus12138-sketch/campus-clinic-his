# 校医院门诊收费系统入口
#   /         管理端（收费员、医生、药师、财务、系统管理员、审计管理员）
#   /api/     后端接口
#
# 限流是第一层防线：异常的大量请求在 Nginx 直接返回 429，不进入应用。

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_ip:10m rate=10r/m;
limit_req_status 429;

upstream clinic_backend {
    server backend:8080;
    keepalive 32;
}

# HTTP 入口，只用于开发与演示编排（CLINIC_TLS=off）。生产编排使用 https.conf，见 40-clinic-tls.sh。
server {
    listen 80;
    server_name _;
    server_tokens off;
    # HTTP 下不发送 HSTS（值为空时 Nginx 不输出该响应头）
    set $hsts "";
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/clinic-locations.conf;
}

